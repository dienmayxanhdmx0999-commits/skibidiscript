<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#ff1a1a"/>
<stop offset="100%" stop-color="#ff7b00"/>
</linearGradient>

<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="8" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="512" height="512" fill="#050505"/>

<!-- Sừng -->
<path d="M125 150
C90 60 170 35 205 120"
fill="none"
stroke="url(#fire)"
stroke-width="14"
stroke-linecap="round"
filter="url(#glow)"/>

<path d="M387 150
C422 60 342 35 307 120"
fill="none"
stroke="url(#fire)"
stroke-width="14"
stroke-linecap="round"
filter="url(#glow)"/>

<!-- Tam giác -->
<polygon
points="256,85 80,410 432,410"
fill="#0a0a0a"
stroke="url(#fire)"
stroke-width="10"
filter="url(#glow)"/>

<!-- Chữ X -->
<path
d="M185 170
L327 342

M327 170
L185 342"
stroke="url(#fire)"
stroke-width="28"
stroke-linecap="round"
filter="url(#glow)"/>

<!-- Mắt trái -->
<path
d="M155 250
Q185 210 225 245"
fill="none"
stroke="url(#fire)"
stroke-width="8"
filter="url(#glow)"/>

