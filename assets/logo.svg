<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Tam Giác Ác Quỷ</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a; /* Nền tối để logo nổi bật */
            margin: 0;
        }
        .logo-container {
            width: 400px;
            height: 400px;
            filter: drop-shadow(0px 10px 15px rgba(255, 0, 0, 0.3)); /* Đổ bóng đỏ ngầu */
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Bắt đầu vẽ SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
            <defs>
                <!-- Hiệu ứng màu gradient cho tam giác -->
                <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#a60000;stop-opacity:1" />
                </linearGradient>
            </defs>

            <!-- 1. CÁI ĐUÔI ÁC QUỶ -->
            <!-- Đường uốn lượn của đuôi -->
            <path d="M 220 210 Q 290 260 280 140" fill="none" stroke="#660000" stroke-width="10" stroke-linecap="round" />
            <!-- Mũi tên ở chóp đuôi -->
            <polygon points="280,115 260,150 300,150" fill="#660000" />

            <!-- 2. CẶP SỪNG ÁC QUỶ (Nằm sau tam giác) -->
            <!-- Sừng trái -->
            <path d="M 115 100 Q 50 10 30 40 Q 70 80 100 130" fill="#660000" />
            <!-- Sừng phải -->
            <path d="M 185 100 Q 250 10 270 40 Q 230 80 200 130" fill="#660000" />

            <!-- 3. TAM GIÁC MÀU ĐỎ -->
            <!-- Vẽ hình tam giác đều trỏ lên trên -->
            <polygon points="150,40 40,230 260,230" fill="url(#redGrad)" stroke="#4d0000" stroke-width="8" stroke-linejoin="round" />

            <!-- 4. CON MẮT TỨC GIẬN -->
            <!-- Lòng trắng mắt -->
            <path d="M 90 130 Q 150 90 210 130 Q 150 170 90 130 Z" fill="#ffffff" stroke="#000000" stroke-width="4" />
            <!-- Lòng đen (đồng tử) -->
            <circle cx="150" cy="130" r="16" fill="#000000" />
            <!-- Ánh sáng phản chiếu trong mắt (nhìn cho nguy hiểm) -->
            <circle cx="150" cy="130" r="4" fill="#ffcc00" />
            
            <!-- Lông mày nhíu chặt tạo cảm giác tức giận -->
            <line x1="70" y1="90" x2="153" y2="125" stroke="#000000" stroke-width="14" stroke-linecap="round" />
            <line x1="230" y1="90" x2="147" y2="125" stroke="#000000" stroke-width="14" stroke-linecap="round" />

            <!-- 5. CHỮ X TO NẰM BÊN TRONG (Dưới con mắt) -->
            <g stroke="#000000" stroke-width="20" stroke-linecap="round">
                <line x1="110" y1="170" x2="190" y2="210" />
                <line x1="190" y1="170" x2="110" y2="210" />
            </g>
        </svg>
    </div>

</body>
</html>
