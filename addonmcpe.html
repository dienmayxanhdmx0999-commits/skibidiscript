<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Web App</title>
    <!-- Thư viện icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Tùy chỉnh CSS */
        :root {
            --bg-color: #15162c;
            --card-bg: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f101f, #1b1e3d, #15162c);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px; /* Nhường chỗ cho thanh điều hướng dưới */
            overflow-x: hidden;
        }

        /* Hiệu ứng nền sao đơn giản */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            z-index: -1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background: rgba(15, 16, 31, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .google-login {
            background: var(--card-bg);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .google-login:hover { background: rgba(255,255,255,0.2); }
        .google-login i { color: #ea4335; font-size: 1.2rem; }

        .logo { font-size: 1.8rem; font-weight: 700; letter-spacing: 2px; }

        .clock {
            font-size: 0.9rem;
            font-weight: 500;
            background: var(--card-bg);
            padding: 5px 10px;
            border-radius: 10px;
        }

        /* Search & Filters */
        .search-container {
            padding: 0 20px;
            margin-bottom: 15px;
        }
        .search-box {
            display: flex; align-items: center;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px 15px;
        }
        .search-box input {
            flex: 1; background: none; border: none; outline: none;
            color: white; margin: 0 10px; font-size: 0.9rem;
        }
        
        .filters {
            display: flex; gap: 10px; padding: 0 20px;
            overflow-x: auto; margin-bottom: 20px;
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: var(--card-bg); border: none; color: white;
            padding: 10px 15px; border-radius: 10px; cursor: pointer;
            transition: 0.3s; flex-shrink: 0;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.2); }

        /* Nút Đăng Bài (FAB) */
        .fab {
            position: fixed; bottom: 90px; right: 20px;
            width: 55px; height: 55px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-radius: 50%; border: none; color: white;
            font-size: 1.5rem; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            z-index: 100; transition: transform 0.3s;
        }
        .fab:hover { transform: scale(1.1); }

        /* Layout Thẻ Bài Viết (Feed) */
        .feed {
            padding: 0 20px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 0.5s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px;
        }
        .card-info h3 { font-size: 1.1rem; margin-bottom: 2px; }
        .card-info p { font-size: 0.8rem; color: var(--text-sub); }
        .card-stats { text-align: center; font-size: 0.9rem; }
        .card-stats i { margin-bottom: 5px; }

        .card-image { width: 100%; height: 200px; object-fit: cover; }

        /* Thanh điều hướng dưới cùng */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 16, 31, 0.95);
            display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px); z-index: 99;
        }
        .nav-item {
            text-align: center; color: var(--text-sub);
            cursor: pointer; transition: 0.3s;
        }
        .nav-item.active, .nav-item:hover { color: var(--accent); }
        .nav-item i { font-size: 1.2rem; display: block; margin-bottom: 5px; }
        .nav-item span { font-size: 0.75rem; }

        /* Modal Đăng Bài */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: 0.3s; z-index: 200;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: #1b1e3d; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 400px;
            transform: translateY(20px); transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-content h2 { margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; outline: none; font-family: 'Poppins', sans-serif;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-submit { background: linear-gradient(45deg, #00c6ff, #0072ff); color: white; }

        /* Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <!-- Header -->
    <header>
        <div class="google-login" title="Đăng nhập Google">
            <i class="fab fa-google"></i>
        </div>
        <div class="logo">MARKET</div>
        <div class="clock" id="clock">00:00:00</div>
    </header>

    <!-- Tìm kiếm -->
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-paper-plane text-sub"></i>
            <input type="text" placeholder="Tìm kiếm nội dung...">
            <i class="fas fa-search"></i>
        </div>
    </div>

    <!-- Lọc danh mục -->
    <div class="filters">
        <button class="filter-btn"><i class="fas fa-infinity"></i></button>
        <button class="filter-btn"><i class="fas fa-globe"></i></button>
        <button class="filter-btn"><i class="fas fa-puzzle-piece"></i></button>
        <button class="filter-btn"><i class="fas fa-layer-group"></i></button>
        <button class="filter-btn"><i class="fas fa-image"></i></button>
        <button class="filter-btn"><i class="fas fa-tshirt"></i></button>
    </div>

    <!-- Nơi chứa các bài viết -->
    <div class="feed" id="feed">
        <!-- Bài viết mẫu 1 -->
        <div class="card">
            <div class="card-header">
                <div class="card-stats"><i class="fas fa-star" style="color: gold;"></i><br>4.4</div>
                <div class="card-info" style="text-align: center; flex: 1;">
                    <h3>Bonkritz Palace</h3>
                    <p>World by Yeggs</p>
                </div>
                <div class="card-stats"><i class="fas fa-fire" style="color: #ff4b2b;"></i><br>9K</div>
            </div>
            <img class="card-image" src="https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1000&auto=format&fit=crop" alt="Palace">
        </div>

        <!-- Bài viết mẫu 2 -->
        <div class="card">
            <div class="card-header">
                <div class="card-stats"><i class="fas fa-star" style="color: gold;"></i><br>4.5</div>
                <div class="card-info" style="text-align: center; flex: 1;">
                    <h3>Prison Escape</h3>
                    <p>World by Impress</p>
                </div>
                <div class="card-stats"><i class="fas fa-fire" style="color: #ff4b2b;"></i><br>6K</div>
            </div>
            <img class="card-image" src="https://images.unsplash.com/photo-1519074069444-1ba4fff66d16?q=80&w=1000&auto=format&fit=crop" alt="Prison">
        </div>
    </div>

    <!-- Nút mở Form Đăng Bài -->
    <button class="fab" onclick="toggleModal()"><i class="fas fa-plus"></i></button>

    <!-- Popup Đăng Bài -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-content">
            <h2>Chia Sẻ Mới</h2>
            <div class="input-group">
                <input type="text" id="postTitle" placeholder="Tên tác phẩm (VD: Siêu xe 3D)">
            </div>
            <div class="input-group">
                <input type="text" id="postAuthor" placeholder="Tên tác giả">
            </div>
            <div class="input-group">
                <input type="text" id="postImage" placeholder="Link URL hình ảnh (https://...)">
            </div>
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="toggleModal()">Hủy</button>
                <button class="btn btn-submit" onclick="submitPost()">Đăng ngay</button>
            </div>
        </div>
    </div>

    <!-- Thanh Menu Dưới -->
    <div class="bottom-nav">
        <div class="nav-item">
            <i class="fas fa-star"></i>
            <span>Featured</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-dragon"></i>
            <span>Mods</span>
        </div>
        <div class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-fire"></i>
            <span>Trending</span>
        </div>
    </div>

    <script>
        // 1. Chức năng Đồng Hồ Thời Gian Thực
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('vi-VN', { hour12: false });
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock(); // Khởi chạy ngay lập tức

        // 2. Chức năng Bật/Tắt Popup Đăng Bài
        const modal = document.getElementById('uploadModal');
        function toggleModal() {
            modal.classList.toggle('active');
        }

        // Đóng popup khi click ra vùng tối ngoài
        modal.addEventListener('click', function(e) {
            if(e.target === modal) toggleModal();
        });

        // 3. Chức năng Xử lý Đăng bài (Hiển thị ngay trên UI - Realtime fake)
        function submitPost() {
            const title = document.getElementById('postTitle').value;
            const author = document.getElementById('postAuthor').value;
            let image = document.getElementById('postImage').value;

            // Validate sơ bộ
            if (!title || !author) {
                alert("Vui lòng nhập đủ Tiêu đề và Tác giả!");
                return;
            }

            // Nếu không có link ảnh, dùng ảnh mặc định cho đẹp
            if (!image) {
                image = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop";
            }

            // Tạo mã HTML cho thẻ bài viết mới
            const newCardHTML = `
                <div class="card">
                    <div class="card-header">
                        <div class="card-stats"><i class="fas fa-star" style="color: gold;"></i><br>New</div>
                        <div class="card-info" style="text-align: center; flex: 1;">
                            <h3>${title}</h3>
                            <p>Tạo bởi ${author}</p>
                        </div>
                        <div class="card-stats"><i class="fas fa-fire" style="color: #ff4b2b;"></i><br>0</div>
                    </div>
                    <img class="card-image" src="${image}" alt="${title}">
                </div>
            `;

            // Chèn bài viết mới lên ĐẦU danh sách feed
            const feed = document.getElementById('feed');
            feed.insertAdjacentHTML('afterbegin', newCardHTML);

            // Xóa dữ liệu cũ trong form và đóng popup
            document.getElementById('postTitle').value = '';
            document.getElementById('postAuthor').value = '';
            document.getElementById('postImage').value = '';
            toggleModal();
        }
    </script>
</body>
</html>
