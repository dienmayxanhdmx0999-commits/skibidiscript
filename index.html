<html lang="vi"> 
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKIBIDI HUB - CARTOON NATURE v10.5 (Ultimate)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Nunito", -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }

    html, body { width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; background-color: #0f172a; }

    body {
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 16px 12px 40px 12px; position: relative;
      transition: background 2s cubic-bezier(0.4, 0, 0.2, 1), color 1.5s ease;
    }

    /* BẢNG MÀU THỜI TIẾT */
    body.weather-sunny { background: linear-gradient(180deg, #38bdf8, #7dd3fc, #4ade80); color: #fff; }
    body.weather-sunset { background: linear-gradient(180deg, #f472b6, #f97316, #c026d3); color: #fff; }
    body.weather-rain-day { background: linear-gradient(180deg, #64748b, #94a3b8, #1e3a29); color: #f8fafc; }
    body.weather-rain-night { background: linear-gradient(180deg, #0f172a, #1e293b, #022c22); color: #cbd5e1; }
    body.weather-storm { background: linear-gradient(180deg, #020617, #0f172a, #022c22); color: #f1f5f9; }
    body.weather-night { background: linear-gradient(180deg, #020617, #172554, #064e3b); color: #cbd5e1; }
    body.weather-snow { background: linear-gradient(180deg, #94a3b8, #cbd5e1, #e2e8f0); color: #0f172a; }
    body.weather-snowstorm { background: linear-gradient(180deg, #475569, #64748b, #94a3b8); color: #fff; }

    /* HIỆU ỨNG THỜI TIẾT ĐẶC BIỆT */
    #lightning-flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 90; }
    #storm-darkness { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); pointer-events: none; z-index: 3; opacity: 0; transition: opacity 2s; }
    #snow-fog { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.5); pointer-events: none; z-index: 3; opacity: 0; transition: opacity 2s; filter: blur(5px); }
    
    body.weather-storm #storm-darkness { opacity: 1; }
    body.weather-snowstorm #snow-fog { opacity: 1; }

    /* CÀNH CÂY & TUYẾT ĐỌNG */
    .top-branch { position: fixed; top: -10px; z-index: 10; pointer-events: none; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }
    .top-branch-left { left: -10px; width: 280px; transform-origin: top left; animation: branchSwayLeft 7s ease-in-out infinite alternate; }
    .top-branch-right { right: -10px; width: 280px; transform-origin: top right; animation: branchSwayRight 8s ease-in-out infinite alternate; }
    @keyframes branchSwayLeft { from { transform: rotate(0deg); } to { transform: rotate(3deg); } }
    @keyframes branchSwayRight { from { transform: rotate(0deg); } to { transform: rotate(-3deg); } }
    
    /* MẶT TRỜI / TRĂNG TÙY BIẾN CHÂN THỰC */
    .sun-moon-container {
      position: fixed; top: 10%; right: 12%; width: 120px; height: 120px;
      pointer-events: none; z-index: 1; transition: all 2s ease;
    }
    .celestial-body { width: 100%; height: 100%; border-radius: 50%; position: absolute; transition: all 2s ease; opacity: 0; }
    
    /* Sun states */
    .the-sun { background: #facc15; box-shadow: 0 0 60px #facc15; border: 4px solid #fef08a; }
    .dark-cloud { position: absolute; bottom: -10px; left: -20px; width: 140px; opacity: 0; transition: opacity 2s; }
    
    body.weather-sunny .the-sun { opacity: 1; transform: scale(1); }
    body.weather-sunset .the-sun { opacity: 1; transform: translate(-30px, 120px) scale(1.3); background: #f97316; box-shadow: 0 0 80px #ea580c; border-color: #fdba74; }
    
    /* Mưa ban ngày: Nắng bị mây che hở 1 miếng */
    body.weather-rain-day .the-sun { opacity: 1; transform: scale(0.9); box-shadow: 0 0 20px #facc15; }
    body.weather-rain-day .dark-cloud { opacity: 1; }
    
    /* Bão / Tuyết: Không thấy mặt trời */
    body.weather-storm .the-sun, body.weather-snow .the-sun, body.weather-snowstorm .the-sun { opacity: 0 !important; }

    /* Moon states */
    .the-moon { background: transparent; box-shadow: -18px 10px 0 0 #fef08a; filter: drop-shadow(0 0 25px rgba(254, 240, 138, 0.8)); }
    body.weather-night .the-moon { opacity: 1; transform: scale(1); }
    /* Mưa ban đêm: Trăng mờ ảo */
    body.weather-rain-night .the-moon { opacity: 0.3; filter: drop-shadow(0 0 10px rgba(254, 240, 138, 0.2)) blur(2px); transform: scale(0.9); }

    /* MÂY, SAO, MƯA, TUYẾT */
    .weather-layer { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
    .stars-container { opacity: 0; transition: opacity 2s; z-index: 1; }
    body.weather-night .stars-container, body.weather-rain-night .stars-container { opacity: 1; }
    
    .moving-cloud { position: absolute; animation: cloudFly linear infinite; transition: fill 2s ease; }
    body.weather-sunny .moving-cloud { fill: #fff; opacity: 0.9; }
    body.weather-sunset .moving-cloud { fill: #ffedd5; opacity: 0.8; }
    body.weather-rain-day .moving-cloud, body.weather-rain-night .moving-cloud { fill: #64748b; opacity: 0.95; }
    body.weather-storm .moving-cloud { fill: #1e293b; opacity: 1; }
    body.weather-snow .moving-cloud, body.weather-snowstorm .moving-cloud { fill: #e2e8f0; opacity: 0.9; }
    body.weather-night .moving-cloud { fill: #1e293b; opacity: 0.5; }
    @keyframes cloudFly { from { transform: translateX(-250px); } to { transform: translateX(110vw); } }

    /* Hạt rơi (Mưa / Tuyết) */
    .particle { position: absolute; border-radius: 50%; opacity: 0; }
    /* Rain */
    body.weather-rain-day .particle, body.weather-rain-night .particle { background: rgba(255,255,255,0.7); width: 2px; height: 30px; animation: fallRain linear infinite; }
    body.weather-storm .particle { background: rgba(255,255,255,0.8); width: 3px; height: 50px; animation: fallStorm linear infinite; }
    @keyframes fallRain { 0%{ transform: translate(0,-50px) rotate(-10deg); opacity:0;} 20%{opacity:1;} 100%{ transform: translate(15vw,120vh) rotate(-10deg); opacity:0;} }
    @keyframes fallStorm { 0%{ transform: translate(0,-50px) rotate(-25deg); opacity:0;} 20%{opacity:1;} 100%{ transform: translate(40vw,120vh) rotate(-25deg); opacity:0;} }
    
    /* Snow */
    body.weather-snow .particle { background: #fff; width: 6px; height: 6px; animation: fallSnow linear infinite; box-shadow: 0 0 5px #fff; }
    body.weather-snowstorm .particle { background: #fff; width: 8px; height: 8px; animation: fallSnowstorm linear infinite; }
    @keyframes fallSnow { 0%{ transform: translate(0,-50px); opacity:0;} 20%{opacity:0.8;} 100%{ transform: translate(20vw, 120vh); opacity:0;} }
    @keyframes fallSnowstorm { 0%{ transform: translate(0,-50px); opacity:0;} 10%{opacity:1;} 100%{ transform: translate(80vw, 120vh); opacity:0;} }

    /* NÚI & ĐẤT */
    .nature-bottom { position: fixed; bottom: 0; left: 0; width: 100vw; height: 320px; pointer-events: none; z-index: 2; }
    .mountains-wrapper, .hills-wrapper, .grass-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; }
    .mountains-wrapper { height: 260px; z-index: 0; } .hills-wrapper { height: 160px; z-index: 1; } .grass-wrapper { height: 60px; z-index: 3; }
    .mountain-svg, .hill-svg, .grass-svg { width: 100%; height: 100%; transition: fill 2s ease; }
    
    /* Đổi màu theo thời tiết */
    .mountain-layer { fill: #075985; transition: fill 2s; }
    body.weather-snow .mountain-layer, body.weather-snowstorm .mountain-layer { fill: #cbd5e1 !important; }
    .hill-layer { fill: #16a34a; transition: fill 2s; }
    body.weather-snow .hill-layer, body.weather-snowstorm .hill-layer { fill: #e2e8f0 !important; }
    .grass-layer { fill: #22c55e; transition: fill 2s; }
    body.weather-snow .grass-layer, body.weather-snowstorm .grass-layer { fill: #f8fafc !important; }

    /* CÂY CỐI & TUYẾT ĐỌNG TRÊN CÂY */
    .forest-container { position: absolute; bottom: 0; width: 100%; height: 280px; z-index: 2; }
    .nature-tree { position: absolute; bottom: 0; transform-origin: bottom center; animation: treeSwaySoft 4s ease-in-out infinite alternate; }
    .tree-leaves { fill: #166534; transition: fill 2s; }
    .tree-snow-cap { fill: #fff; opacity: 0; transition: opacity 2s; }
    body.weather-snow .tree-snow-cap, body.weather-snowstorm .tree-snow-cap { opacity: 1; }
    body.weather-storm .nature-tree, body.weather-snowstorm .nature-tree { animation-duration: 1s !important; }
    @keyframes treeSwaySoft { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

    /* MENU 3 GẠCH (HAMBURGER) ĐẸP GỌN GÀNG */
    .top-right-menu { position: fixed; top: 16px; right: 16px; z-index: 100; }
    .hamburger-btn {
      width: 48px; height: 48px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
      border-radius: 16px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
      border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.2s;
    }
    .hamburger-btn span { width: 24px; height: 3px; background: #fff; border-radius: 3px; transition: 0.3s; }
    .hamburger-btn:active { transform: scale(0.9); }
    
    .dropdown-menu {
      position: absolute; top: 60px; right: 0; width: 220px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transform: translateY(-10px); transition: 0.3s;
    }
    .dropdown-menu.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    
    .menu-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      background: rgba(255,255,255,0.1); border-radius: 12px; text-decoration: none;
      color: #fff; font-weight: 800; font-size: 0.9rem; transition: background 0.2s;
    }
    .menu-item:hover { background: rgba(255,255,255,0.2); }
    .menu-item svg { width: 20px; height: 20px; }
    
    /* Volume Slider trong Menu */
    .volume-box { padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px; }
    .volume-label { color: #aaa; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; display: block;}
    .volume-slider { width: 100%; height: 6px; -webkit-appearance: none; background: #475569; border-radius: 4px; outline: none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #4ade80; border-radius: 50%; cursor: pointer; }

    /* GIAO DIỆN CHÍNH (KHÔNG VIỀN, KÍNH MỜ, ĐẸP MẮT) */
    .glass-card {
      position: relative; z-index: 50; width: 100%; max-width: 420px; margin: 40px auto 20px auto;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
      border-radius: 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); /* Bóng đổ khối thay vì viền */
      padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; text-align: center;
      border: none; /* ĐÃ XÓA VIỀN THÔ */
    }

    .title { font-size: 2.2rem; font-weight: 900; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.3); letter-spacing: 1px; }
    .subtitle { color: #e2e8f0; font-size: 0.85rem; font-weight: 800; background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 12px; display: inline-block; margin: 0 auto;}

    /* TABS */
    .nav-tabs { display: flex; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 20px; }
    .nav-btn {
      flex: 1; padding: 12px 0; background: transparent; color: #94a3b8; border: none;
      border-radius: 14px; font-size: 0.9rem; font-weight: 900; cursor: pointer; transition: 0.3s;
    }
    .nav-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

    /* HIỆU ỨNG TUYẾT ĐỌNG TRÊN BOX VÀ NÚT */
    .snow-acc { position: relative; }
    body.weather-snow .snow-acc::after, body.weather-snowstorm .snow-acc::after {
      content: ''; position: absolute; top: -4px; left: 5%; right: 5%; height: 8px;
      background: #fff; border-radius: 10px; opacity: 0.9; filter: blur(1px); pointer-events: none; z-index: 2;
    }

    /* BOX NỘI DUNG XÓA VIỀN */
    .tab-content { display: none; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; padding: 5px; }
    .tab-content.active { display: flex; animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

    .box {
      background: rgba(255, 255, 255, 0.08); /* Nền mờ thay cho viền */
      border: none; border-radius: 18px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px; text-align: left;
      transition: background 0.2s, transform 0.2s;
    }
    .box:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.02); }
    
    .box-header { display: flex; justify-content: space-between; align-items: center; }
    .box-title { font-size: 0.95rem; font-weight: 900; color: #fff; }
    
    .box-btn {
      background: #3b82f6; color: #fff; border: none; border-radius: 12px;
      padding: 8px 16px; font-size: 0.8rem; font-weight: 800; text-decoration: none;
      cursor: pointer; transition: 0.2s; text-align: center;
    }
    .box-btn:active { transform: scale(0.9); }
    .box-btn.copy { background: #8b5cf6; }

    .script-text { background: rgba(0, 0, 0, 0.4); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.75rem; color: #86efac; word-break: break-all; }

  </style>
</head>

  <script>
    // TẠO CÂY CHO RỪNG
    function generateForest() {
      const container = document.getElementById('forest-box');
      for (let i = 0; i < 15; i++) {
        let tree = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        tree.setAttribute("viewBox", "0 0 100 200");
        tree.className.baseVal = "nature-tree";
        tree.style.left = (i * 6.5 + Math.random()*2) + '%';
        tree.style.width = (40 + Math.random()*30) + 'px';
        tree.style.height = (80 + Math.random()*60) + 'px';
        tree.style.animationDelay = -Math.random()*5 + 's';
        tree.innerHTML = `
          <rect x="45" y="140" width="10" height="60" fill="#451a03"/>
          <path class="tree-leaves" d="M50,20 L85,75 L70,75 L95,130 L5,130 L30,75 L15,75 Z"/>
          <path class="tree-snow-cap" d="M50,20 L65,45 Q50,55 35,45 Z" />
          <path class="tree-snow-cap" d="M70,75 L80,95 Q50,100 20,95 L30,75 Z" />`;
        container.appendChild(tree);
      }
    }

    // TẠO MÂY VÀ HẠT (MƯA/TUYẾT)
    function initWeatherVisuals(mode) {
      const cloudBox = document.getElementById('moving-clouds');
      cloudBox.innerHTML = '';
      for(let i=0; i<6; i++){
        let c = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        c.setAttribute("viewBox", "0 0 200 100");
        c.className.baseVal = "moving-cloud";
        c.style.width = (150 + Math.random()*150) + 'px';
        c.style.top = (Math.random()*20) + 'vh';
        c.style.animationDuration = (20 + Math.random()*30) + 's';
        c.style.animationDelay = -(Math.random()*50) + 's';
        c.innerHTML = `<path d="M40,60 Q20,60 20,40 Q20,20 40,20 Q50,5 70,5 Q100,5 110,25 Q130,10 150,25 Q170,25 170,45 Q170,60 150,60 Z"/>`;
        cloudBox.appendChild(c);
      }

      const pBox = document.getElementById('particles-box');
      pBox.innerHTML = '';
      let pCount = 0;
      if(mode.includes('rain')) pCount = 80;
      if(mode === 'storm') pCount = 150;
      if(mode === 'snow') pCount = 60;
      if(mode === 'snowstorm') pCount = 150;

      for(let i=0; i<pCount; i++){
        let p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random()*150 - 20) + 'vw';
        p.style.animationDuration = (0.5 + Math.random()*1.5) + 's';
        p.style.animationDelay = (Math.random()*2) + 's';
        pBox.appendChild(p);
      }
    }

    // LOGIC THỜI TIẾT & ÂM THANH
    const weatherTypes = ['sunny', 'sunset', 'night', 'rain-day', 'rain-night', 'storm', 'snow', 'snowstorm'];
    let currentMode = '';
    let lastMode = '';
    let timeCounter = 0;
    
    const audios = {
      nature: document.getElementById('audio-nature'),
      rain: document.getElementById('audio-rain'),
      wind: document.getElementById('audio-wind'),
      frog: document.getElementById('audio-frog'),
      bird: document.getElementById('audio-bird'),
      thunder: document.getElementById('audio-thunder')
    };

    function setVolume(vol) {
      Object.values(audios).forEach(a => a.volume = vol);
    }
    document.getElementById('vol-slider').addEventListener('input', (e) => setVolume(e.target.value / 100));

    // Bắt đầu nhạc khi click lần đầu (bỏ block autoplay của trình duyệt)
    let audioStarted = false;
    document.addEventListener('pointerdown', () => {
      if(!audioStarted) {
        setVolume(document.getElementById('vol-slider').value / 100);
        updateAudioState();
        audioStarted = true;
      }
    });

    function updateAudioState() {
      if(!audioStarted) return;
      // Dừng hết
      audios.nature.pause(); audios.rain.pause(); audios.wind.pause(); audios.frog.pause();

      if(currentMode === 'sunny' || currentMode === 'sunset') audios.nature.play();
      if(currentMode.includes('rain')) audios.rain.play();
      if(currentMode === 'storm' || currentMode === 'snowstorm') { audios.rain.play(); audios.wind.play(); }
      if(currentMode === 'snow') audios.wind.play(); // Gió nhẹ
      
      // Logic Ếch nhái: Ban đêm + vừa hết mưa
      if(currentMode === 'night' && (lastMode.includes('rain') || lastMode === 'storm')) {
        audios.frog.play();
      }
    }

    // Chim hót tự động lâu lâu 1 lần vào ban ngày
    setInterval(() => {
      if(audioStarted && (currentMode === 'sunny' || currentMode === 'sunset')) {
        audios.bird.currentTime = 0;
        audios.bird.play();
      }
    }, 25000); // 25s 1 lần

    // Sấm sét ngẫu nhiên khi bão
    setInterval(() => {
      if(currentMode === 'storm' && Math.random() > 0.5) {
        document.getElementById('lightning-flash').style.opacity = 1;
        setTimeout(() => document.getElementById('lightning-flash').style.opacity = 0, 100);
        if(audioStarted) audios.thunder.play();
      }
    }, 4000);

    function applyWeather(mode) {
      lastMode = currentMode;
      currentMode = mode;
      document.body.className = 'weather-' + mode;
      initWeatherVisuals(mode);
      updateAudioState();
    }

    // Thay đổi thời tiết
    function weatherLoop() {
      timeCounter += 5; // Cập nhật mỗi 5 giây
      let nextMode;
      
      // Đúng 10 phút (600s) -> Chắc chắn nắng
      if(timeCounter >= 600) {
        nextMode = 'sunny';
        timeCounter = 0; // reset
      } else if (timeCounter % 60 === 0) { // Mỗi 1 phút random thời tiết 1 lần
        nextMode = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];
      }

      if(nextMode && nextMode !== currentMode) {
        applyWeather(nextMode);
      }
    }

    // Khởi tạo
    generateForest();
    applyWeather('sunny');
    setInterval(weatherLoop, 5000);

    // MENU VÀ TABS LOGIC
    function toggleMenu() {
      document.getElementById('menu-dropdown').classList.toggle('show');
    }
    
    // Đóng menu khi click ngoài
    document.addEventListener('click', (e) => {
      if(!e.target.closest('.top-right-menu')) {
        document.getElementById('menu-dropdown').classList.remove('show');
      }
    });

    function switchTab(id, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    function copyCode(btn) {
      const text = btn.closest('.box').querySelector('.script-text').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.innerText; btn.innerText = 'Đã Copy!';
        setTimeout(() => btn.innerText = old, 1500);
      });
    }
  </script>
</body>
</html>
