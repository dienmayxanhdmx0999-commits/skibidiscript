  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      /* Bầu trời xanh tươi mát ở trên -> Cỏ cây xanh tươi ở dưới */
      background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 30%, #4ade80 70%, #15803d 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* ☁️ Mây trôi bầu trời */
    .sky-clouds {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 35vh;
      background: radial-gradient(circle at 15% 30%, rgba(255, 255, 255, 0.4) 0%, transparent 40%),
                  radial-gradient(circle at 65% 25%, rgba(255, 255, 255, 0.35) 0%, transparent 45%),
                  radial-gradient(circle at 45% 55%, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
      animation: floatClouds 30s linear infinite alternate;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(-35%); }
    }

    /* 💨 Luồng gió thổi ngang mờ mờ */
    .wind-line {
      position: fixed;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: breezePass linear infinite;
    }

    @keyframes breezePass {
      0% { transform: translateX(-20vw); opacity: 0; }
      30% { opacity: 0.7; }
      70% { opacity: 0.7; }
      100% { transform: translateX(120vw); opacity: 0; }
    }

    /* 🌾 Thảm cỏ đung đưa dưới chân trang */
    .grass-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      pointer-events: none;
      z-index: 3;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      overflow: hidden;
    }

    .grass-blade {
      width: 12px;
      height: 55px;
      background: linear-gradient(0deg, #14532d 0%, #22c55e 100%);
      border-radius: 100% 100% 0 0;
      transform-origin: bottom center;
      animation: swayGrass 3.5s ease-in-out infinite alternate;
    }

    .grass-blade:nth-child(even) {
      height: 40px;
      animation-duration: 2.8s;
      animation-delay: -1s;
      background: linear-gradient(0deg, #166534 0%, #4ade80 100%);
    }

    .grass-blade:nth-child(3n) {
      height: 65px;
      animation-duration: 4.2s;
      animation-delay: -2s;
    }

    @keyframes swayGrass {
      0% { transform: rotate(-8deg) skewX(-5deg); }
      100% { transform: rotate(18deg) skewX(10deg); }
    }

    /* 🍃 Lá cây bay chao đảo chill chill */
    #leaf-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 4;
    }

    .chill-leaf {
      position: absolute;
      user-select: none;
      font-size: 1.2rem;
      animation: chillFalling ease-in-out infinite;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.15));
    }

    /* Quá trình lá nhấp nhô lên xuống & rớt dịu dàng theo gió */
    @keyframes chillFalling {
      0% {
        transform: translate(0, 0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.9;
        transform: translate(10vw, 8vh) rotate(25deg);
      }
      35% {
        transform: translate(25vw, 18vh) rotate(-15deg);
      }
      55% {
        transform: translate(45vw, 38vh) rotate(35deg);
      }
      75% {
        transform: translate(68vw, 60vh) rotate(-10deg);
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translate(95vw, 92vh) rotate(50deg);
        opacity: 0;
      }
    }

    /* Khung chính Wrapper */
    .wrapper {
      width: 100%;
      max-width: 440px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Tiêu đề Skibidi Hub */

      animation: skyGreenShimmer 5s ease infinite;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
      text-transform: uppercase;
    }

    @keyframes skyGreenShimmer {
      0% { background-position: 0% 50%; }

    }
