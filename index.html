<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Skibidi Script</title>

<style>
body {
    background: #020617;
    color: #e2e8f0;
    font-family: monospace;
    text-align: center;
    padding: 20px;
}

h1 {
    color: #22c55e;
}

textarea {
    width: 90%;
    height: 250px;
    background: #0f172a;
    color: #22c55e;
    border: 1px solid #22c55e;
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
}

button {
    margin: 10px;
    padding: 10px 20px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    color: black;
    cursor: pointer;
}

.output {
    margin-top: 20px;
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
    word-wrap: break-word;
}
</style>

</head>

<body>

<h1>💻 SKIBIDI SCRIPT</h1>

<textarea id="input" placeholder="Dán script vào đây..."></textarea>
<br>

<button onclick="saveText()">Lưu</button>
<button onclick="copyText()">Copy</button>
<button onclick="clearText()">Xóa</button>

<div class="output" id="outputBox"></div>

<script>
function saveText() {
    let text = document.getElementById("input").value;
    localStorage.setItem("script", text);
    document.getElementById("outputBox").innerText = text;
}

function copyText() {
    let text = document.getElementById("input");
    text.select();
    document.execCommand("copy");
    alert("Đã copy!");
}

function clearText() {
    document.getElementById("input").value = "";
    document.getElementById("outputBox").innerText = "";
    localStorage.removeItem("script");
}

// load lại khi mở web
window.onload = function() {
    let saved = localStorage.getItem("script");
    if(saved) {
        document.getElementById("input").value = saved;
        document.getElementById("outputBox").innerText = saved;
    }
}
</script>

</body>
</html>
