<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReizShare</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0e11;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #8a8a93;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Row 4 mục chọn */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px 0;
      background-color: #1a1a1e;
      color: #ffffff;
      border: 1px solid #2e2e35;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      background-color: #4f46e5;
      border-color: #4f46e5;
    }

    /* Khung chính giống ảnh mẫu */
    .card {
      background-color: #141418;
      border: 1px solid #282830;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
    }

    .notice-box {
      background-color: #1a1215;
      border: 1px solid #4a1d24;
      color: #f87171;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .field-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
      display: block;
    }

    .input-box {
      width: 100%;
      padding: 14px;
      background-color: #0e0e11;
      border: 1px solid #282830;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.85rem;
      margin-bottom: 16px;
      outline: none;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      background-color: #1f2029;
      border: 1px solid #333545;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .main-btn:hover {
      background-color: #2b2d3a;
    }

    .card-footer {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1 class="title">ReizShare</h1>
    <p class="subtitle">Quick and simple sharing service</p>

    <!-- 4 Nút tương ứng 4 mục -->
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="setTab('link', this)">Link</button>
      <button class="nav-btn" onclick="setTab('script', this)">Script</button>
      <button class="nav-btn" onclick="setTab('apk', this)">APK</button>
      <button class="nav-btn" onclick="setTab('ios', this)">iOS</button>
    </div>

    <!-- Khung chính -->
    <div class="card">
      <div class="notice-box">
        Trang thai: Hoat dong binh thuong
      </div>

      <label class="field-label" id="fieldLabel">Link cua ban</label>
      <input type="text" id="displayInput" class="input-box" readonly>

      <button class="main-btn" id="actionBtn" onclick="handleAction()">Mo ngay -> </button>

      <div class="card-footer">
        Protected by ReizShare
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // BAN CHINH SUA LINK HOAC SCRIPT CUA 4 MUC TAI DAY:
    // =========================================================
    const DATA = {
      link: "https://gofile.io/d/S1FNjL",
      link: "https://gofile.io/d/p0Mww1",
      script: "loadstring(game:HttpGet('https://script-cua-ban.lua'))()",
      apk: "https://link-tai-apk.com/app.apk",
      ios: "https://link-tai-ios.com/app.ipa"
    };
    // =========================================================

    let currentTab = 'link';

    function setTab(tab, element) {
      currentTab = tab;
      
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      const input = document.getElementById('displayInput');
      const label = document.getElementById('fieldLabel');
      const btn = document.getElementById('actionBtn');

      input.value = DATA[tab] || '';

      if (tab === 'script') {
        label.innerText = 'Noi dung Script';
        btn.innerText = 'Sao chep Script ->';
      } else {
        label.innerText = 'Duong dan ' + tab.toUpperCase();
        btn.innerText = 'Mo / Tai ngay ->';
      }
    }

    function handleAction() {
      const val = DATA[currentTab];
      if (!val) return;

      if (currentTab === 'script') {
        navigator.clipboard.writeText(val);
        const btn = document.getElementById('actionBtn');
        btn.innerText = 'Da sao chep!';
        setTimeout(() => {
          btn.innerText = 'Sao chep Script ->';
        }, 1500);
      } else {
        window.open(val, '_blank');
      }
    }

    // Chay mac dinh tab Link khi vao trang
    setTab('link', document.querySelectorAll('.nav-btn')[0]);
  </script>
</body>
</html>
