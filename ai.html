<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOX GPT - Lõi Trí Tuệ</title>
    <!-- Liên kết đến file CSS của bạn -->
    <link rel="stylesheet" href="ai.css">
</head>
<body>

    <div class="header">
        <img src="assets/logo.svg" alt="NOX Logo">
        <h1>NOX_GPT // Core</h1>
    </div>

    <div class="chat-container" id="chat-box">
        <!-- Tin nhắn khởi động -->
        <div class="message ai">
            <img src="assets/avatar-ai.png" alt="NOX">
            <div class="text-bubble">Hệ thống kích hoạt. Tôi là NOX. Yêu cầu của bạn là gì?</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Nhập dữ liệu..." autocomplete="off">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <!-- Liên kết đến file JS của bạn -->
    <script src="ai.js"></script>

</body>
</html>
