<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOXGPT</title>

<link rel="stylesheet" href="ai.css">

</head>
<body>

<div class="sidebar">

<div class="logo">
<div class="icon">N</div>
<div>
<h2>NOXGPT</h2>
<p>Cyber AI</p>
</div>
</div>

<button class="newchat" onclick="location.reload()">
+ Cuộc trò chuyện mới
</button>

</div>

<div class="main">

<div class="topbar">

<h1>NOXGPT</h1>

<span class="online">
● ONLINE
</span>

</div>

<div id="chatBox" class="chat">

<div class="welcome">

<h2>Xin chào 👋</h2>

<p>Hôm nay bạn muốn hỏi gì?</p>

</div>

</div>

<div class="inputBox">

<textarea
id="prompt"
placeholder="Nhập tin nhắn..."
rows="1"></textarea>

<button onclick="sendMessage()">

➤

</button>

</div>

</div>

<script src="ai.js"></script>

</body>
</html>
